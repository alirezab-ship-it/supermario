<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Plumber Bros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <h1>Super Plumber Bros</h1>
    <div id="stage">
      <canvas id="game" width="800" height="480"></canvas>
      <div id="start-screen">
        <div id="start-content">
          <p id="start-tagline">Run, jump, stomp goombas, and race to the flag!</p>
          <ul id="start-info">
            <li>Move: ← → / A D</li>
            <li>Jump: Space / ↑ / W</li>
          </ul>
          <button id="start-btn">Start Game</button>
        </div>
      </div>
      <div id="overlay" class="hidden">
        <div id="overlay-title"></div>
        <div id="overlay-sub"></div>
        <button id="overlay-btn">Play Again</button>
      </div>
    </div>
    <p class="hint">Move: ← → / A D &nbsp;|&nbsp; Jump: Space / ↑ / W &nbsp;|&nbsp; Stomp goombas, grab coins, reach the flag!</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
