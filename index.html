<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario-style Platformer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <h1>Super Plumber Bros</h1>
    <canvas id="game" width="800" height="480"></canvas>
    <div id="overlay" class="hidden">
      <div id="overlay-title"></div>
      <div id="overlay-sub"></div>
      <button id="overlay-btn">Play Again</button>
    </div>
    <p class="hint">Move: ← → / A D &nbsp;|&nbsp; Jump: Space / ↑ / W &nbsp;|&nbsp; Stomp goombas, grab coins, reach the flag!</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
